name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送v开头的tag时触发

# 关键：添加权限声明
permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 设置 Node.js 环境
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 22
        cache: 'npm'  # 自动缓存 npm 依赖

    # 安装依赖
    - name: Install dependencies
      run: npm ci

    # 编译
    - name: Build Project
      run: npm run build

    - name: 检查编译结果
      run: ls -lhR ./.next

    # 压缩代码
    - name: 压缩代码
      run: |
        # 创建 .next 目录的压缩包（Next.js默认输出目录）
        # 写入commit hash到文件中
        echo "${{ github.sha }}" > ./.next/commit_hash.txt
        # 压缩代码
        cd ./.next
        tar -czvf ../dist.tar.gz ./*
        cd ..

    # 使用社区 Action 支持覆盖
    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        files: dist.tar.gz
        overwrite: true  # 覆盖已存在的Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}