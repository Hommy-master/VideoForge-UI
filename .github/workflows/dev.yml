name: Build And Deploy WebUI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build And Deploy WebUI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 设置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'  # 自动缓存 npm 依赖

      # 安装依赖
      - name: Install dependencies
        run: npm ci

      # 编译
      - name: Build Project
        run: npm run build

      - name: 检查编译结果
        run: ls -lhR ./.next